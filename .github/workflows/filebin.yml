name: Robust Upload to Filebin

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل برای دانلود'
        required: true
        type: string
      file_name:
        description: 'نام فایل همراه با پسوند (مثال: file.mp4)'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود پرسرعت و پایدار فایل
        env:
          TARGET_URL: ${{ inputs.file_url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          mkdir -p downloads
          cd downloads

          echo "بررسی و آماده‌سازی aria2c..."
          which aria2c > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y aria2 -qq)

          echo "شروع دانلود با چند کانکشن هم‌زمان..."
          aria2c \
            --continue=true \
            --max-connection-per-server=4 \
            --split=4 \
            --min-split-size=5M \
            --max-tries=20 \
            --retry-wait=3 \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --out="$FILE_NAME" \
            "$TARGET_URL"

          if [ ! -f "$FILE_NAME" ]; then
            echo "خطا: فایل دانلود نشد."
            exit 1
          fi

          echo "دانلود با موفقیت پایان یافت. مشخصات فایل:"
          ls -lh "$FILE_NAME"

      - name: آپلود استریم به Filebin
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          cd downloads

          echo "در حال ارسال فایل به Filebin..."
          curl --progress-bar \
            -X POST \
            -T "$FILE_NAME" \
            -H "filename: $FILE_NAME" \
            -H "Content-Type: application/octet-stream" \
            -o response.json \
            -w "%{http_code}" \
            "https://filebin.net/darsialijadid/$FILE_NAME" > status_code.txt

          HTTP_STATUS=$(cat status_code.txt)
          echo ""
          echo "کد پاسخ سرور: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "--------------------------------------------------"
            echo "✅ آپلود موفقیت‌آمیز بود."
            echo "📁 سطل: https://filebin.net/darsiali"
            echo "📥 فایل: https://filebin.net/darsiali/$FILE_NAME"
            echo "--------------------------------------------------"
          else
            echo "❌ خطا در آپلود سرور Filebin. کد وضعیت: $HTTP_STATUS"
            exit 1
          fi
