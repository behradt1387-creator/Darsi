name: Remote Upload to Filebin

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل برای دانلود'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود فایل
        env:
          TARGET_URL: ${{ inputs.file_url }}
        run: |
          mkdir -p downloads
          cd downloads
          # دانلود فایل و تشخیص خودکار نام اصلی از روی هدرهای سرور
          wget --content-disposition --trust-server-names "$TARGET_URL"

      - name: آپلود به Filebin در پوشه darsiali
        run: |
          cd downloads
          # پیدا کردن نام فایلی که دانلود شده است
          FILE_NAME=$(ls -1 | head -n 1)

          if [ -z "$FILE_NAME" ]; then
            echo "خطا: فایلی یافت نشد."
            exit 1
          fi

          echo "فایل شناسایی شد: $FILE_NAME"
          echo "در حال ارسال به Filebin..."

          # ارسال به API پوشه darsiali در filebin
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            --data-binary "@$FILE_NAME" \
            -H "filename: $FILE_NAME" \
            -H "Content-Type: application/octet-stream" \
            "https://filebin.net/darsiali/$FILE_NAME")

          echo "کد پاسخ سرور: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "--------------------------------------------------"
            echo "✅ آپلود با موفقیت انجام شد."
            echo "📁 لینک پوشه: https://filebin.net/darsiali"
            echo "📥 لینک فایل: https://filebin.net/darsiali/$FILE_NAME"
            echo "--------------------------------------------------"
          else
            echo "❌ خطا در آپلود. کد وضعیت: $HTTP_STATUS"
            exit 1
          fi
