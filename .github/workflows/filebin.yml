name: Remote Upload to Filebin

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل برای دانلود'
        required: true
        type: string
      file_name:
        description: 'نام فایل همراه با پسوند (مثال: document.pdf یا archive.zip)'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود و آپلود فایل
        env:
          TARGET_URL: ${{ inputs.file_url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          mkdir -p downloads
          cd downloads

          echo "در حال دانلود فایل..."
          # دانلود فایل و ذخیره با نام ورودی کاربر
          curl -L -f --progress-bar "$TARGET_URL" -o "$FILE_NAME"

          if [ ! -f "$FILE_NAME" ]; then
            echo "خطا: فایل دانلود نشد یا لینک نامعتبر است."
            exit 1
          fi

          echo "فایل با موفقیت دانلود شد: $FILE_NAME"
          echo "در حال ارسال به Filebin..."

          # آپلود فایل در پوشه darsiali
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            --data-binary "@$FILE_NAME" \
            -H "filename: $FILE_NAME" \
            -H "Content-Type: application/octet-stream" \
            "https://filebin.net/darsiali/$FILE_NAME")

          echo "کد پاسخ سرور: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "--------------------------------------------------"
            echo "✅ آپلود با موفقیت انجام شد."
            echo "📁 لینک سطل: https://filebin.net/darsiali"
            echo "📥 لینک مستقیم فایل: https://filebin.net/darsiali/$FILE_NAME"
            echo "--------------------------------------------------"
          else
            echo "❌ خطا در آپلود. کد وضعیت: $HTTP_STATUS"
            exit 1
          fi
