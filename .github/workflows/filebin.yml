name: Stream Upload to Filebin

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل برای دانلود'
        required: true
        type: string
      file_name:
        description: 'نام فایل همراه با پسوند (مثال: archive.zip)'
        required: true
        type: string

jobs:
  stream-upload:
    runs-on: ubuntu-latest
    steps:
      - name: استریم مستقیم داده‌ها از مبدأ به Filebin
        env:
          TARGET_URL: ${{ inputs.file_url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -e -o pipefail

          echo "🚀 شروع استریم زنده فایل..."
          echo "🌐 مبدأ: $TARGET_URL"
          echo "📦 نام مقصد: $FILE_NAME"

          # دانلود با curl و پایپ مستقیم به آپلود Filebin بدون نوشتن روی دیسک
          # سوئیچ -T - یعنی داده را به صورت Chunked از stdin بخوان
          curl -f -L "$TARGET_URL" \
            | curl -s -S \
              -X POST \
              -T - \
              -H "filename: $FILE_NAME" \
              -H "Content-Type: application/octet-stream" \
              -o response.json \
              -w "%{http_code}" \
              "https://filebin.net/darsiali/$FILE_NAME" > status_code.txt

          HTTP_STATUS=$(cat status_code.txt)
          echo ""
          echo "کد وضعیت HTTP سرور: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "--------------------------------------------------"
            echo "✅ استریم و انتقال با موفقیت تکمیل شد."
            echo "📁 پوشه: https://filebin.net/darsiali"
            echo "📥 فایل: https://filebin.net/darsiali/$FILE_NAME"
            echo "--------------------------------------------------"
          else
            echo "❌ خطا در حین انتقال. کد وضعیت: $HTTP_STATUS"
            exit 1
          fi
